name: Test_node_proj
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: get code 
              uses: actions/checkout@v7
            - name: insall node 
              uses: actions/setup-node@v7
              with:
                  node_version: '24'
            - name: install dependencies
              run: npm ci
            - name: Run tests
              run: npm test 

    build:
        needs: test
        runs-on: ubuntu-latest
        steps: 
            - name: get code 
              uses: actions/checkout/@v7
            - name: install node.js
              uses: actions/setup-node@v7
              with:
                  node_version: '24'
            - name: install dependencies
              run: npm ci      
              
            - name: Build proj
              run: npm run build

            - name: Deploy
              run: echo "deploy application"

            - name: Upload build aritifact
              uses: actions/upload-artifact@v7
              with:
                  name: dist-file
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: download artifact
              uses: actions/download-artifact@v8
              with: 
                  name: dist-file
                  
            - name: list the files
              run: ls -la

            - name: deploy
              run: echo "deploy"
              

    

